# Nginx reverse proxy for the Ziyar Majlis dashboard.
# Place at: /etc/nginx/sites-available/ziyar.flyziyara.com
# then: sudo ln -s /etc/nginx/sites-available/ziyar.flyziyara.com /etc/nginx/sites-enabled/
#
# This only serves ziyar.flyziyara.com — it does NOT touch the existing
# wa.flyziyara.com config. certbot will add the SSL (443) block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name ziyar.flyziyara.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
